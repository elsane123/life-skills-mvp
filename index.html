<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vraie Vie | MVP</title>
    <style>
        html, body { padding: 0; margin: 0; font-family: sans-serif; background-color: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .main { width: 100%; max-width: 420px; height: 90vh; max-height: 844px; display: flex; border: 1px solid #333; border-radius: 20px; overflow: hidden; position: relative; }
        .reelContainer { width: 100%; height: 100%; position: relative; }
        .video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 1rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        .username { font-weight: bold; margin: 0; }
        .sideControls { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .controlButton { font-size: 1.8rem; }
    </style>
</head>
<body>
    <main class="main">
        <div class="reelContainer">
            <video class="video" src="public/videos/01_fiche_de_paie_final.mp4" autoplay loop muted playsinline></video>
            <div class="overlay">
                <p class="username">@lavraievie.fr</p>
                <p>ON TE DOIT DE L'ARGENT ? On décode ça en 60s.</p>
                 <div class="sideControls">
                    <div class="controlButton">❤️</div>
                    <div class="controlButton">💬</div>
                    <div class="controlButton">🔗</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
